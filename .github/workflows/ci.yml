name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tarbya
          POSTGRES_PASSWORD: tarbya
          POSTGRES_DB: tarbya
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tarbya"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Receives sign-in codes; the API e2e reads them from its HTTP API.
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env

      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx format:check
      - run: pnpm nx affected -t lint typecheck test build

      # The committed OpenAPI spec and generated client must match the API code.
      - run: pnpm nx run api-client:generate
      - run: git diff --exit-code -- apps/api/openapi.json libs/api-client/src/generated

      # S3 for profile pictures; the same SeaweedFS as docker-compose.yml.
      - name: Start SeaweedFS
        run: |
          docker run -d -p 9000:8333 -e AWS_ACCESS_KEY_ID=tarbya -e AWS_SECRET_ACCESS_KEY=tarbya-secret \
            chrislusf/seaweedfs:4.50 server -dir=/data -s3 -s3.port=8333
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:9000 && break; sleep 2; done

      - run: pnpm nx run db:migrate-deploy
      - run: pnpm exec playwright install --with-deps chromium
      # One suite at a time: both use the API on :3000.
      - run: pnpm nx affected -t e2e --parallel=1
