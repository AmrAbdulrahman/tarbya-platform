# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tarbya
      POSTGRES_PASSWORD: tarbya
      POSTGRES_DB: tarbya
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tarbya']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tarbya
      MINIO_ROOT_PASSWORD: tarbya-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
